name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        run: |
          curl -sSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          echo "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d "$HOME/tools"
          echo "$HOME/tools/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Resolve version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "タグは vX.Y.Z 形式にしてください (受け取った値: $GITHUB_REF_NAME)" >&2
              exit 1
            fi
            MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
            if [ "$((10#$MINOR))" -gt 999 ] || [ "$((10#$PATCH))" -gt 999 ]; then
              echo "versionCode に収めるため Y / Z は 999 以下にしてください (受け取った値: $GITHUB_REF_NAME)" >&2
              exit 1
            fi
            VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          else
            VERSION_NAME="0.0.0-dev.${{ github.run_number }}"
            VERSION_CODE=${{ github.run_number }}
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "secrets.KEYSTORE_BASE64 が未設定です" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          PERMS=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$APK")
          if ! grep -qx "package: com.grouppins.photobridge" <<< "$PERMS"; then
            echo "aapt2 の出力に package 行が無く、権限を検査できていません:" >&2
            printf '%s\n' "$PERMS" >&2
            exit 1
          fi
          if grep -q "android.permission.INTERNET" <<< "$PERMS"; then
            echo "INTERNET 権限が APK に含まれています" >&2
            exit 1
          fi

      - name: Package artifacts
        run: |
          NAME="grouppins-photo-bridge-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ env.VERSION_NAME }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "このリリースの APK は GitHub Actions が本 repo のソースからビルドしたものです。"
            echo "実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            cat "${APK_NAME}.sha256"
            echo '```'
            echo
            echo "ビルド時に APK の署名と INTERNET 権限の不在を検証しています"
            echo "(workflow の Verify APK ステップ)。手元でも確認できます:"
            echo
            echo '```'
            echo "sha256sum -c ${APK_NAME}.sha256"
            echo "\$ANDROID_HOME/build-tools/35.0.0/aapt2 dump permissions ${APK_NAME}"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            "$APK_NAME" "${APK_NAME}.sha256" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
