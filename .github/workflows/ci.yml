name: ci

on:
  # PR は pull_request で、main はマージ後の push で検査する。push にブランチ絞りが
  # 無いと、PR を開いているブランチで 1 回の push につき 2 回走り、タグ push でも
  # release と同じ検査が二重に走る
  push:
    branches: [main]
  pull_request:

# 連続 push で古い実行を打ち切る。main は打ち切らない (マージ後の記録を残す)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/android-build-env

      - name: Build, test and lint
        run: gradle assembleDebug testDebugUnitTest lintDebug --no-daemon

      - name: Verify APK permissions
        run: .github/scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk
